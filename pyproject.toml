[project]
name = "ti-aaa"
version = "0.2.1"
description = "Tech Internship Autonomous Application Agent powered by community GitHub internship lists"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "TI-AAA contributors" }]
keywords = ["internships", "job-application", "automation", "github", "career-tracker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pypdf>=5.0,<7",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6.0,<7",
  "reportlab>=4.2,<5",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
tiaaa = "tiaaa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiaaa"]

[tool.hatch.build]
artifacts = [
  "src/tiaaa/templates/*.json",
  "src/tiaaa/templates/*.yaml",
  "src/tiaaa/dashboard/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
