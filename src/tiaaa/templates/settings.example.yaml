poll_interval_seconds: 300

service:
  # The poller runs even when no browser is open.
  enabled: true
  auto_prepare: true

filters:
  # Empty means accept all roles in the tech-internship repositories.
  include_role_keywords: []
  exclude_keywords: []
  allowed_locations: []
  remote_only: false

review:
  # Reads each employer posting and decides Apply / Don't apply for every listing.
  enabled: true
  model: claude-opus-5
  # Applications the agent will spend at one company. Extra roles there are declined.
  max_applications_per_company: 2
  # Only review listings posted within this many days. 0 reviews the whole backlog.
  max_listing_age_days: 2
  # If false, decisions are made from list metadata alone and marked low confidence.
  fetch_postings: true
  # Re-read the posting and re-decide after this many days.
  refresh_after_days: 21
  # Upper bound on companies reviewed in one poll cycle.
  max_companies_per_cycle: 12
  posting_timeout_seconds: 25

preparation:
  use_llm: false
  generate_cover_letters: true

automation:
  # Auto mode applies only to roles found after the initial repository baseline.
  auto_apply_new: false
  # If true, an explicit manual Apply action may submit after completing the form.
  # Missing facts and one-time verification codes still pause in the Agent view.
  manual_auto_submit: false
  # If true, Auto mode also requires the role, location, and term preferences in profile.json.
  auto_apply_use_preferences: false
  # Browser permission is requested only after Auto mode is on and this is enabled in the web app.
  web_push_notifications: false
  # CLI safety switch for `tiaaa apply --submit`. The web app uses in-app confirmation.
  allow_submission: false
  max_applications_per_cycle: 5
  max_applications_per_day: 25
  max_attempts: 3
  claude_model: sonnet
  headless: false
  timeout_seconds: 600

dashboard:
  host: 127.0.0.1
  port: 8787
