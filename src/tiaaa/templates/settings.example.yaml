poll_interval_seconds: 300

service:
  # The poller runs even when no browser is open.
  enabled: true
  auto_prepare: true

filters:
  # Empty means accept all roles in the tech-internship repositories.
  include_role_keywords: []
  exclude_keywords: []
  allowed_locations: []
  remote_only: false

preparation:
  use_llm: false
  generate_cover_letters: true

automation:
  # Auto mode applies only to roles found after the initial repository baseline.
  auto_apply_new: false
  # Auto mode uses candidate qualifications for this score. Preferences do not change it.
  auto_apply_minimum_fit_score: 7
  # If true, Auto mode also requires the role, location, and term preferences in profile.json.
  auto_apply_use_preferences: false
  # Browser permission is requested only after Auto mode is on and this is enabled in the web app.
  web_push_notifications: false
  # CLI safety switch for `tiaaa apply --submit`. The web app uses in-app confirmation.
  allow_submission: false
  max_applications_per_cycle: 5
  max_applications_per_day: 25
  max_attempts: 3
  claude_model: sonnet
  headless: false
  timeout_seconds: 600

dashboard:
  host: 127.0.0.1
  port: 8787
