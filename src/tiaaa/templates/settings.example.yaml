poll_interval_seconds: 300
minimum_fit_score: 5

service:
  # The poller runs even when no browser is open.
  enabled: true
  auto_prepare: true

filters:
  # Empty means accept all roles in the tech-internship repositories.
  include_role_keywords: []
  exclude_keywords: []
  allowed_locations: []
  remote_only: false

preparation:
  use_llm: false
  generate_cover_letters: true
  # Reorders existing resume facts into an ATS-friendly PDF; it never invents content.
  tailor_resumes: true

automation:
  # Opt in to browser workers for matching roles discovered after this is enabled.
  # Current and previously discovered roles remain available for manual Apply actions.
  auto_apply_new: false
  # False fills forms for review; true lets the background service click final Submit.
  allow_submission: false
  workers: 1
  max_applications_per_cycle: 5
  max_applications_per_day: 25
  max_attempts: 3
  claude_model: sonnet
  headless: false
  timeout_seconds: 600

dashboard:
  host: 127.0.0.1
  port: 8787
