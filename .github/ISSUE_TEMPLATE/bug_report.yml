name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include profile data, resume contents, API keys, passwords, or full agent logs.
  - type: input
    id: version
    attributes:
      label: TI-AAA version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GitHub discovery/parser
        - Queue/database
        - Preparation/scoring
        - Browser application
        - Dashboard
        - CLI/packaging
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and minimal reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant tool versions. Redact personal data.
